<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Biodata</legend>

        <form action="#" >  
        <label for="name">Name:</label>
        <br><br>
        <input type="text" name="name" id="name" placeholder="Enter your name" required><br><br>
        <label for="password">Password:</label>
        <br><br>
        <input type="password" name="password" id="password" placeholder="Enter your password" required><br><br>
        <label for="tel">Telephone:</label><br><br> 
        <input type="tel" name="tel" id="tel" placeholder="Enter your telephone number" required><br><br>
        <label for="email">Email:</label><br><br> 
        <input type="email" name="email" id="email" placeholder="Enter your email" required><br><br>
        <label for="dob">Date of Birth:</label><br><br>
        <input type="date" name="dob" id="dob" required><br><br> 
        <label for="address">Address:</label><br><br>
        <textarea name="address" id="address" placeholder="Enter your address" required></textarea><br><br> 
        <label for="gender">Gender:</label><br><br>
        <input type="radio" name="gender" id="male" value="male" required> <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female" required> <label for="female">Female</label>
        <input type="radio" name="gender" id="other" value="other" required> <label for="other">Other</label><br><br> 
        <label for="hobbies">Hobbies:</label><br><br>
        <input type="checkbox" name="hobbi1" id="hobbi1" value="hobbi1"> <label for="cricket">cricket</label> 
        <input type="checkbox" name="hobbi2" id="hobbi2" value="hobbi2"> <label for="football">football</label>
        <input type="checkbox" name="hobbi3" id="hobbi3" value="hobbi3"> <label for="hockey">hockey</label>  
        <input type="checkbox" name="hobbi4" id="hobbi4" value="hobbi4"> <label for="tennis">tennis</label><br><br>
        <label for="lang">Programming Language:</label><br><br>   
         <select name="lang" id="lang" required>
         option value="">Select your programming language</option>          
            <option value="C">c</option>
            <option value="C++">C++</option>
            <option value="python">Python</option>
            <option value="JAVA">JAVA</option>               
        </form>
    </fieldset>
</body>
</html>
